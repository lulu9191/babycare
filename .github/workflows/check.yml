name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Project boundaries
        run: bash scripts/check-redlines.sh
      - name: Static checks
        run: npm run check
      - name: Behavior tests
        run: npm test
